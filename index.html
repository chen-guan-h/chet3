<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b2a20">
<title>暖暖小食堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 版面：全螢幕遊戲；選單是暖橘牆面上的奶油色貼紙按鈕，遊戲畫面全部畫在畫布上 */
:root {
  --ink: #5a3e2e; --cream: #fff8ec; --cream-2: #f6e6cc; --tomato: #e34b3f; --mustard: #f2b833; --teal: #3f9ea0; --sky: #3f9be0; --brown: #7a5236;
  --f: "Huninn", "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --fn: "Zen Maru Gothic", "Huninn", ui-rounded, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #3b2a20; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: #3b2a20; color: var(--ink); font-family: var(--f); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
#app { position: relative; height: 100%; }
.scr { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 26px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: repeating-linear-gradient(90deg, #f6d9a8 0 26px, #efc98e 26px 52px); }
.logo { margin: 0; text-align: center; font: 900 clamp(40px, 12vw, 64px)/1.05 var(--fn); color: #fff8ec; -webkit-text-stroke: 9px var(--tomato); paint-order: stroke fill; filter: drop-shadow(0 5px 0 var(--ink)); letter-spacing: .04em; }
.tag { margin: 0; text-align: center; font-size: 15px; max-width: 22em; line-height: 1.6; text-wrap: balance; }
#tArt { width: min(340px, 100%); height: auto; aspect-ratio: 340 / 220; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(420px, 100%); }
.mode { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 12px 14px; border-radius: 20px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 5px 0 var(--ink); min-width: 0; }
.mode b { font-size: 19px; } .mode small { font-size: 12.5px; color: #8a6a52; line-height: 1.45; }
.mode.solo { background: #ffe39a; } .mode.vs { background: #ffc7b9; } .mode.coop { background: #c9ecd0; } .mode.net { background: #c6e3fb; }
.mode:active, .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn { padding: 11px 18px; border-radius: 999px; border: 3px solid var(--ink); background: var(--mustard); box-shadow: 0 4px 0 var(--ink); font-size: 17px; }
.btn.alt { background: var(--cream); }
.btn.sm { padding: 5px 14px; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
.bar { display: flex; align-items: center; gap: 10px; width: min(560px, 100%); }
.bar h2 { margin: 0; flex: 1; font-size: 22px; }
.chip { padding: 4px 12px; border-radius: 999px; background: var(--cream); border: 2.5px solid var(--ink); font: 700 15px var(--fn); font-variant-numeric: tabular-nums; }
.ibtn { width: 42px; height: 42px; border-radius: 14px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); font-size: 18px; display: grid; place-items: center; padding: 0; }
#restTabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(560px, 100%); }
.rt { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 18px; border: 3px solid var(--ink); background: var(--cream); text-align: left; }
.rt b { font-size: 17px; } .rt small { font-size: 12px; color: #8a6a52; }
.rt.on { background: var(--mustard); } .rt.lock { opacity: .55; }
#levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(560px, 100%); }
.lv { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: 18px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 4px 0 var(--ink); }
.lv .num { position: absolute; top: 6px; left: 10px; font: 900 20px var(--fn); color: var(--tomato); }
.lv canvas { width: 140px; height: 50px; }
.lv .st i { font-style: normal; font-size: 18px; color: #d9c7ac; } .lv .st i.on { color: #f2b833; }
.lv small { font-size: 12px; color: #8a6a52; }
.lv.lock { opacity: .5; }
#online .card { width: min(420px, 100%); background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#oStatus { margin: 0; font-size: 15px; line-height: 1.7; }
.code { font: 900 30px var(--fn); letter-spacing: .2em; color: var(--tomato); }
.join { display: flex; gap: 8px; }
#oCode { flex: 1; min-width: 0; font: 700 22px var(--fn); letter-spacing: .3em; padding: 8px 12px; border-radius: 14px; border: 3px solid var(--ink); text-align: center; background: #fff; color: var(--ink); }
.inv { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.pulse { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.hint { margin: 0; font-size: 13.5px; color: #8a6a52; line-height: 1.6; }

#game { position: absolute; inset: 0; background: #3b2a20; }
#cv { display: block; touch-action: none; }
#bPause { position: absolute; top: 4px; right: max(8px, env(safe-area-inset-right, 0px)); width: 40px; height: 38px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--cream); font-size: 16px; z-index: 3; opacity: .92; }
#mid { position: absolute; left: 0; right: 0; top: calc(50% - 22px); height: 44px; display: flex; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--brown); color: #fff4dc; z-index: 3; }
#midTxt { flex: 1; min-width: 0; font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mid button { border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); padding: 4px 12px; font-size: 13px; color: var(--ink); }
#midBtns { display: flex; gap: 6px; }

#modal { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(40,25,15,0.55); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modalBox { width: min(400px, 100%); max-height: 88%; overflow-y: auto; background: var(--cream); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: pop .3s cubic-bezier(.2,1.5,.4,1) both; }
#modalBox h2 { margin: 0; font-size: 24px; text-align: center; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stats span { display: flex; flex-direction: column; align-items: center; padding: 6px; background: #fff; border-radius: 14px; border: 2px solid var(--cream-2); font-size: 12px; color: #8a6a52; }
.stats b { font: 800 19px var(--fn); color: var(--ink); font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border-radius: 14px; border: 2px solid var(--cream-2); }
.row > div { flex: 1; min-width: 0; display: flex; flex-direction: column; } .row small { font-size: 12.5px; color: #8a6a52; }
.lvl { font: 700 13px var(--fn); color: var(--teal); }
.toast { position: absolute; z-index: 30; left: 50%; top: 18%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 40px); padding: 8px 16px; border-radius: 999px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); font-size: 15px; pointer-events: none; animation: tin .25s both; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, -8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <section id="title" class="scr">
    <h1 class="logo">暖暖小食堂</h1>
    <canvas id="tArt" width="340" height="220"></canvas>
    <p class="tag">客人排隊點餐，你負責烤肉、煎蛋、組盤、出餐。一個人手忙腳亂，兩個人更熱鬧。</p>
    <div class="modes">
      <button class="mode solo" data-mode="solo"><b>單人遊戲</b><small>一個人顧整個櫃檯</small></button>
      <button class="mode vs" data-mode="vs"><b>同機對戰</b><small>手機平放在桌上，上下各一間店，比誰賺得多</small></button>
      <button class="mode coop" data-mode="coop"><b>同機合作</b><small>兩個人一起點同一個廚房，客人更多</small></button>
      <button class="mode net" data-mode="net"><b>連線合作</b><small>傳邀請連結給朋友，兩支手機一起顧店</small></button>
    </div>
    <button class="btn alt sm" id="bSound">音效：開</button>
  </section>

  <section id="select" class="scr" hidden>
    <div class="bar"><button class="ibtn" id="bBack" aria-label="返回">‹</button><h2 id="selMode">單人</h2><span class="chip">$ <b id="selCoins">0</b></span><button class="btn sm" id="bShop">升級</button></div>
    <div id="restTabs"></div>
    <div id="levels"></div>
  </section>

  <section id="online" class="scr" hidden>
    <div class="bar"><button class="ibtn" id="oBack" aria-label="返回">‹</button><h2>連線合作</h2></div>
    <div class="card">
      <p id="oStatus"></p>
      <button class="btn" id="bHost">開房間</button>
      <div class="join"><input id="oCode" autocapitalize="characters" autocomplete="off" maxlength="5" placeholder="房號" aria-label="五碼房號"><button class="btn alt" id="bJoin">加入房間</button></div>
      <p class="hint">不用帳號，只要有這個網址就能一起玩。主持人開房間後分享邀請連結；遊戲由主持人的手機計算，隊友的點擊會即時傳過去。兩支手機都要保持畫面開著。</p>
    </div>
  </section>

  <section id="game" hidden>
    <canvas id="cv" aria-label="廚房"></canvas>
    <button id="bPause" aria-label="暫停">Ⅱ</button>
    <div id="mid" hidden><button id="bPause2" aria-label="暫停">Ⅱ</button><span id="midTxt"></span><div id="midBtns" hidden><button id="bAgain">再來一局</button><button id="bQuit">離開</button></div></div>
  </section>

  <div id="modal" hidden><div id="modalBox"></div></div>
  <div id="toast" class="toast" hidden></div>
</div>

LC.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  lerp: (a, b, t) => a + (b - a) * t,
  ease: t => 1 - Math.pow(1 - t, 3),
};

<script>

})();

          if (s.s === 'c') { ring(x + 32, y - 34, 9, s.t / R.cook2.cook, '#f2b833'); for (let j = 0; j < 4; j++) A.c(ctx, x - 28 + ((t * 50 + j * 17) % 56), y + 22 - ((t * 30 + j * 11) % 20), 2.2, 'rgba(255,250,220,0.8)'); }

<script>
/* 模組 5／6：連線合作（網站版）— 用 PeerJS 做手機對手機的點對點連線。主持人跑遊戲並送出狀態，隊友送出點擊 */
(function () {
'use strict';
const LC = window.LC;
const PREFIX = 'cozycounter-chef-v1-';
const CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

LC.Net = {
  peer: null, conn: null, role: null, code: '', partner: null, last: 0,
  newCode() { let s = ''; for (let i = 0; i < 5; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)]; return s; },
  err(code) { const e = new Error(code); e.code = code; return e; },
  available() { return typeof window.Peer === 'function'; },
  open(role, code) {
    return new Promise((resolve, reject) => {
      if (!this.available()) return reject(this.err('no-lib'));
      this.close();
      this.role = role; this.code = code; this.partner = null;
      const opts = { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } };
      let settled = false;
      const ok = () => { if (!settled) { settled = true; resolve(); } };
      const fail = c => { if (!settled) { settled = true; this.close(); reject(this.err(c)); } else if (this.onLost) this.onLost(c); };
      const timer = setTimeout(() => fail('timeout'), 15000);
      const peer = this.peer = role === 'host' ? new window.Peer(PREFIX + code, opts) : new window.Peer(opts);
      peer.on('error', e => { clearTimeout(timer); fail(e && e.type ? e.type : 'network'); });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { /* 略過 */ } });
      if (role === 'host') {
        peer.on('open', () => { clearTimeout(timer); ok(); });
        peer.on('connection', conn => {
          if (this.conn && this.conn.open) { conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); }); return; }
          this.bind(conn);
        });
      } else {
        peer.on('open', () => {
          const conn = peer.connect(PREFIX + code, { reliable: true });
          this.bind(conn, () => { clearTimeout(timer); ok(); });
        });
      }
    });
  },
  bind(conn, onOpen) {
    this.conn = conn;
    conn.on('open', () => { this.partner = conn.peer; if (onOpen) onOpen(); if (this.onPartner) this.onPartner(true); });
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'tap' && this.role === 'host' && this.onTap) this.onTap(+d.x || 0, +d.y || 0);
      else if (d.t === 's' && this.role === 'guest' && this.onState) this.onState(d.s);
      else if (d.t === 'full' && this.role === 'guest' && this.onFull) this.onFull();
    });
    const gone = () => { if (this.conn !== conn) return; this.conn = null; const had = !!this.partner; this.partner = null; if (had && this.onPartner) this.onPartner(false); };
    conn.on('close', gone); conn.on('error', gone);
  },
  close() {
    try { if (this.conn) this.conn.close(); } catch (e) { /* 略過 */ }
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* 略過 */ }
    this.conn = null; this.peer = null; this.role = null; this.partner = null;
  },
  push(s, force) {
    if (this.role !== 'host' || !this.conn || !this.conn.open) return;
    const now = performance.now(); if (!force && now - this.last < 70) return; this.last = now;
    try { this.conn.send({ t: 's', s }); } catch (e) { /* 略過 */ }
  },
  tap(x, y) {
    if (this.role !== 'guest' || !this.conn || !this.conn.open) return;
    try { this.conn.send({ t: 'tap', x: Math.round(x), y: Math.round(y) }); } catch (e) { /* 略過 */ }
  },
};
})();

</script>
<script>
/* 模組 6／6：介面 — 標題與模式、選關與升級、單人／同機對戰（上下分屏）／同機合作／連線合作的畫面配置、多點觸控、倒數與結算 */
(function () {
'use strict';
const LC = window.LC;
const $ = id => document.getElementById(id);
const S = () => LC.Save.d;

const UI = LC.UI = {
  mode: 'solo', rest: 'burger', run: null, dpr: 1, t: 0,

  init() {
    LC.Save.load();
    this.cv = $('cv'); this.ctx = this.cv.getContext('2d');
    window.addEventListener('resize', () => this.resize());
    if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe($('game'));
    this.cv.addEventListener('pointerdown', e => this.pointer(e));
    document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => { LC.Audio.init(); this.pickMode(b.dataset.mode); }; });
    $('bBack').onclick = () => this.show('title');
    $('oBack').onclick = () => { LC.Net.close(); this.show('title'); };
    $('bShop').onclick = () => this.shop();
    $('bPause').onclick = () => this.pause();
    $('bPause2').onclick = () => this.pause();
    $('bSound').onclick = () => { LC.Audio.muted = !LC.Audio.muted; S().muted = LC.Audio.muted; LC.Save.save(); this.syncSound(); };
    $('bHost').onclick = () => this.netHost();
    $('bJoin').onclick = () => { LC.Audio.init(); this.netJoin(); };
    $('bAgain').onclick = () => { const r = this.run; if (r) this.start(r.rk, r.li); };
    $('bQuit').onclick = () => this.leaveGame();
    LC.Net.onPartner = on => this.netPartner(on);
    LC.Net.onState = s => this.netState(s);
    LC.Net.onFull = () => { this.netStatus('這個房間已經有兩個人了。'); LC.Net.close(); };
    LC.Net.onLost = c => this.toast('連線中斷（' + c + '）');
    LC.Net.onTap = (x, y) => { const r = this.run; if (r && r.phase === 'play' && !r.paused) r.ks[0].tap(x, y, 2); };
    this.syncSound(); this.show('title'); this.titleArt();
    const m = location.hash.match(/join=([A-Za-z0-9]{5})/);
    if (m) { this.mode = 'net'; this.show('online'); $('oCode').value = m[1].toUpperCase(); this.netStatus('點「加入房間」開始連線。'); $('bJoin').classList.add('pulse'); }
    let last = performance.now();
    const loop = now => { const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; try { this.frame(dt); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  syncSound() { $('bSound').textContent = LC.Audio.muted ? '音效：關' : '音效：開'; },
  show(id) { for (const s of ['title', 'select', 'online', 'game']) $(s).hidden = s !== id; if (id === 'game') this.resize(); if (id !== 'game') LC.Audio.stopMusic(); },

  pickMode(m) {
    this.mode = m;
    if (m === 'net') { this.show('online'); this.netStatus('選擇開房間或加入隊友的房間。'); return; }
    this.openSelect();
  },
  modeName() { return { solo: '單人', vs: '同機對戰', coop: '同機合作', net: '連線合作' }[this.mode]; },

  /* ---------- 選關 ---------- */
  openSelect() {
    this.show('select');
    $('selMode').textContent = this.modeName();
    $('selCoins').textContent = S().coins;
    $('restTabs').innerHTML = LC.REST_ORDER.map(k => { const R = LC.REST[k], lock = !LC.Save.unlocked(k, 0); return `<button class="rt${this.rest === k ? ' on' : ''}${lock ? ' lock' : ''}" data-rest="${k}"><b>${R.n}</b><small>${lock ? '漢堡屋第 4 關過關後開放' : R.sub}</small></button>`; }).join('');
    $('restTabs').querySelectorAll('[data-rest]').forEach(b => { b.onclick = () => { if (!LC.Save.unlocked(b.dataset.rest, 0)) return this.toast('先在森林漢堡屋通過第 4 關'); this.rest = b.dataset.rest; this.openSelect(); }; });
    const R = LC.REST[this.rest];
    $('levels').innerHTML = R.levels.map((lv, i) => {
      const st = S().stars[this.rest][i] || 0, lock = !LC.Save.unlocked(this.rest, i);
      return `<button class="lv${lock ? ' lock' : ''}" data-lv="${i}"><span class="num">${i + 1}</span><canvas width="180" height="64" data-menu="${i}"></canvas><span class="st">${[0, 1, 2].map(k => `<i class="${k < st ? 'on' : ''}">★</i>`).join('')}</span><small>${lock ? '尚未解鎖' : `目標 $${this.mode === 'coop' || this.mode === 'net' ? Math.round(lv.target * 1.5) : lv.target}・${lv.dur} 秒`}</small></button>`;
    }).join('');
    $('levels').querySelectorAll('[data-menu]').forEach(c => { const x = c.getContext('2d'), lv = R.levels[+c.dataset.menu]; x.clearRect(0, 0, 180, 64); lv.menu.forEach((d, j) => LC.Art.dish(x, R, d, 22 + j * 27, 38, 0.42, 1)); });
    $('levels').querySelectorAll('[data-lv]').forEach(b => { b.onclick = () => { const i = +b.dataset.lv; if (!LC.Save.unlocked(this.rest, i)) return this.toast('先通過前一關'); if (this.mode === 'net' && !LC.Net.partner) return this.toast('隊友還沒加入房間'); this.start(this.rest, i); }; });
  },
  shop() {
    const R = LC.REST[this.rest], up = S().up[this.rest];
    const rows = LC.UPGRADES.map(u => { const lv = up[u.k] || 0, max = u.max || u.p.length, p = u.p[lv]; return `<div class="row"><div><b>${u.n}</b> <span class="lvl">Lv ${lv}/${max}</span><small>${u.d}</small></div>${lv >= max ? '<span class="lvl">已滿</span>' : `<button class="btn sm" data-up="${u.k}">$${p}</button>`}</div>`; }).join('');
    this.modal(`${R.n}・升級`, `<p class="hint">持有金幣 $${S().coins}。升級只影響這間餐廳。</p><div class="rows">${rows}</div>`, [{ t: '關閉', f: () => this.openSelect() }]);
    document.querySelectorAll('[data-up]').forEach(b => { b.onclick = () => { const u = LC.UPGRADES.find(q => q.k === b.dataset.up), lv = up[u.k] || 0; if (S().coins < u.p[lv]) return this.toast('金幣不夠'); S().coins -= u.p[lv]; up[u.k] = lv + 1; LC.Save.save(); LC.Audio.sfx('coin'); this.shop(); }; });
  },

  /* ---------- 開局 ---------- */
  start(rk, li, guest) {
    const seed = (Math.random() * 1e9) | 0;
    const mk = coop => { const k = new LC.Kitchen(rk, li, { seed, coop }); k.onEnd = () => this.checkEnd(); return k; };
    const ks = this.mode === 'vs' ? [mk(false), mk(false)] : [mk(this.mode === 'coop' || this.mode === 'net')];
    if (this.mode === 'vs') ks[1].silent = true;
    if (guest) { ks[0].silent = true; ks[0].onEnd = () => this.checkEnd(); }

    this.show('game'); this.layout();
    $('bPause').hidden = this.mode === 'vs'; $('mid').hidden = this.mode !== 'vs';
    $('bPause').disabled = !!guest; $('midBtns').hidden = true; $('midTxt').textContent = '上下兩位各自經營，時間到比誰賺得多';
    LC.Audio.startMusic();
  },
  checkEnd() {
    const r = this.run; if (!r || r.phase === 'end') return;
    if (!r.ks.every(k => k.over)) return;
    r.phase = 'end'; r.endT = 0;
    const k = r.ks[0], R = LC.REST[r.rk];
    if (this.mode === 'vs') {
      const [a, b] = r.ks; S().coins += Math.round(Math.max(a.coins, b.coins) / 2); LC.Save.save(); LC.Audio.sfx('win');
      $('midTxt').textContent = a.coins === b.coins ? '平手！' : a.coins > b.coins ? '下方玩家獲勝！' : '上方玩家獲勝！';
      $('midBtns').hidden = false;
      return;
    }
    const st = k.stars || 0;
    if (!r.guest) { S().stars[r.rk][r.li] = Math.max(S().stars[r.rk][r.li] || 0, st); }
    S().coins += k.coins; LC.Save.save();
    if (this.mode === 'net' && !r.guest) LC.Net.push({ ph: 'end', r: r.rk, li: r.li, k: k.ser() }, true);
    LC.Audio.sfx(st ? 'win' : 'lose');
    setTimeout(() => {
      const next = r.li + 1 < R.levels.length && LC.Save.unlocked(r.rk, r.li + 1);
      const btns = r.guest ? [{ t: '等主持人選下一關', f: () => {} }, { t: '離開房間', f: () => { LC.Net.close(); this.show('title'); } }]
        : [...(next ? [{ t: '下一關', f: () => this.start(r.rk, r.li + 1) }] : []), { t: '再玩一次', f: () => this.start(r.rk, r.li) }, { t: '選關', f: () => this.leaveGame() }];
      this.modal(st ? `過關！${'★'.repeat(st)}${'☆'.repeat(3 - st)}` : '差一點點…', `<div class="stats"><span>賺到金幣<b>$${k.coins}</b></span><span>目標<b>$${k.target}</b></span><span>服務道數<b>${k.served}</b></span><span>最高連擊<b>${k.maxCombo}</b></span><span>生氣離開<b>${k.angry}</b></span><span>錢包<b>$${S().coins}</b></span></div>${st ? '' : '<p class="hint">提示：先把肉餅或煎蛋放上去再組盤，烤好的東西別放太久會燒焦；用連擊多拿獎勵。</p>'}`, btns);
    }, 900);
  },
  leaveGame() {
    if (this.mode === 'net' && LC.Net.role === 'host') LC.Net.push({ ph: 'lobby' }, true);
    this.run = null; this.closeModal();
    if (this.mode === 'net' && LC.Net.role === 'guest') { this.show('online'); return; }
    this.openSelect();
  },
  pause() {
    const r = this.run; if (!r || r.phase === 'end' || r.guest) return;
    r.paused = true;
    this.modal('暫停', `<p class="hint">${this.modeName()}・${LC.REST[r.rk].n} 第 ${r.li + 1} 關</p>`, [{ t: '繼續', f: () => { r.paused = false; } }, { t: '重新開始', f: () => this.start(r.rk, r.li) }, { t: '離開', f: () => this.leaveGame() }]);
  },

  /* ---------- 畫面配置與觸控 ---------- */
  resize() {
    const g = $('game').getBoundingClientRect(); if (g.width < 10) return;
    this.dpr = Math.min(2, window.devicePixelRatio || 1); this.W = g.width; this.H = g.height;
    this.cv.width = Math.round(g.width * this.dpr); this.cv.height = Math.round(g.height * this.dpr);
    this.cv.style.width = g.width + 'px'; this.cv.style.height = g.height + 'px';
    this.layout();
  },
  layout() {
    const r = this.run; if (!r || !this.W) return;
    const W = this.W, H = this.H, mid = 44;
    r.vps = this.mode === 'vs' ? [{ k: 0, x: 0, y: H / 2 + mid / 2, w: W, h: H / 2 - mid / 2, rot: false, who: 1 }, { k: 1, x: 0, y: 0, w: W, h: H / 2 - mid / 2, rot: true, who: 2 }]
      : [{ k: 0, x: 0, y: 0, w: W, h: H, rot: false, who: 1 }];
    for (const v of r.vps) { v.s = Math.min(v.w / LC.KW, v.h / LC.KH); v.ox = v.x + (v.w - LC.KW * v.s) / 2; v.oy = v.y + (v.h - LC.KH * v.s) / 2; v.cx = v.x + v.w / 2; v.cy = v.y + v.h / 2; }
  },
  pointer(e) {
    LC.Audio.init();
    const r = this.run; if (!r || !r.vps || r.paused || r.phase !== 'play' || this.modalOpen) return;
    e.preventDefault();
    const rc = this.cv.getBoundingClientRect(); let px = e.clientX - rc.left, py = e.clientY - rc.top;
    for (const v of r.vps) {
      if (px < v.x || px > v.x + v.w || py < v.y || py > v.y + v.h) continue;
      let qx = px, qy = py; if (v.rot) { qx = 2 * v.cx - px; qy = 2 * v.cy - py; }
      const lx = (qx - v.ox) / v.s, ly = (qy - v.oy) / v.s, k = r.ks[v.k];
      if (r.guest) { LC.Net.tap(lx, ly); k.lastTap = { x: lx, y: ly, who: 2, t: k.anim }; LC.Audio.sfx('tap'); }
      else k.tap(lx, ly, v.who);
      return;
    }
  },

  /* ---------- 主迴圈 ---------- */
  frame(dt) {
    this.t += dt;
    const r = this.run; if (!r) return;
    if (!r.paused && !this.modalOpen) {
      if (r.guest) { for (const k of r.ks) { k.anim += dt; for (const f of k.fx) f.t += dt; } }
      else if (r.phase === 'count') { const before = Math.ceil(r.count); r.count -= dt; if (Math.ceil(r.count) !== before && r.count > 0) LC.Audio.sfx('tap'); if (r.count <= 0) { r.phase = 'play'; LC.Audio.sfx('go'); } for (const k of r.ks) k.anim += dt; }
      else for (const k of r.ks) k.update(dt);
      if (r.phase === 'end') { r.endT += dt; for (const k of r.ks) { k.anim += dt; for (const f of k.fx) f.t += dt; } }
    }
    if (this.mode === 'net' && LC.Net.role === 'host' && r.phase !== 'end') LC.Net.push({ ph: r.phase, r: r.rk, li: r.li, c: Math.ceil(r.count), k: r.ks[0].ser() });
    this.render();
  },
  render() {
    const r = this.run, ctx = this.ctx, d = this.dpr; if (!r.vps) this.layout(); if (!r.vps) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#3b2a20'; ctx.fillRect(0, 0, this.cv.width, this.cv.height);
    for (const v of r.vps) {
      const k = r.ks[v.k];
      ctx.save(); ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip();
      if (v.rot) { ctx.translate(v.cx, v.cy); ctx.rotate(Math.PI); ctx.translate(-v.cx, -v.cy); }
      ctx.translate(v.ox, v.oy); ctx.scale(v.s, v.s);
      const label = this.mode === 'vs' ? (v.who === 1 ? '玩家一' : '玩家二') : this.mode === 'net' ? (r.guest ? '隊友' : '主持人') : '';
      LC.Art.kitchen(ctx, k, k.anim, { showWho: this.mode === 'net' || this.mode === 'coop', label });
      // 倒數與結束
      if (r.phase === 'count') this.bigText(ctx, Math.ceil(r.count) > 0 ? String(Math.ceil(r.count)) : '開始！', '#fff4dc');
      if (r.phase === 'end' && this.mode === 'vs') { const o = r.ks[1 - v.k], win = k.coins > o.coins, tie = k.coins === o.coins; this.bigText(ctx, tie ? '平手' : win ? '你贏了！' : '再接再厲', win ? '#ffd95a' : '#fff4dc', `$${k.coins}・${k.served} 道・最高 ${k.maxCombo} 連擊`); }
      else if (k.over && r.phase !== 'count') this.bigText(ctx, '時間到！', '#fff4dc');
      ctx.restore();
    }
  },
  bigText(ctx, s, col, sub) {
    ctx.fillStyle = 'rgba(40,25,15,0.45)'; ctx.fillRect(0, 380, LC.KW, sub ? 210 : 160);
    ctx.textAlign = 'center'; ctx.font = '800 92px "Zen Maru Gothic", "Huninn", sans-serif'; ctx.lineWidth = 12; ctx.strokeStyle = '#5a3e2e';
    ctx.strokeText(s, LC.KW / 2, 500); ctx.fillStyle = col; ctx.fillText(s, LC.KW / 2, 500);
    if (sub) { ctx.font = '700 28px "Zen Maru Gothic", "Huninn", sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(sub, LC.KW / 2, 560); }
  },

  /* ---------- 連線合作 ---------- */
  netStatus(msg) { $('oStatus').innerHTML = msg; },
  netWhy(e) {
    const c = (e && e.code) || '';
    const why = {
      'no-lib': '連線元件沒有載入，請確認網路後重新整理頁面。',
      'peer-unavailable': '找不到這個房間。請確認房號，或請主持人先開房間、並保持畫面開著。',
      'unavailable-id': '這個房號剛好被用掉了，請再按一次「開房間」。',
      'timeout': '連線逾時。兩支手機都連上網路後再試一次；行動網路不通時，可以改用 Wi-Fi。',
      'network': '網路連線有問題，請確認網路後再試。', 'server-error': '連線伺服器暫時沒有回應，請稍後再試。', 'socket-error': '連線伺服器暫時沒有回應，請稍後再試。',
      'browser-incompatible': '這個瀏覽器不支援即時連線，請改用手機內建的 Chrome 或 Safari。', 'webrtc': '兩支手機之間打不通，換個網路（例如改用 Wi-Fi）再試。',
    }[c];
    return (why || '連線失敗，請稍後再試。') + (c ? `<br><small>（代碼：${c}）</small>` : '');
  },
  invite(code) { return location.href.split('#')[0] + '#join=' + code; },
  async netHost() {
    const code = LC.Net.newCode();
    this.netStatus('正在開房間…');
    try { await LC.Net.open('host', code); }
    catch (e) { return this.netStatus(this.netWhy(e)); }
    const link = this.invite(code);
    this.netStatus(`房號 <b class="code">${code}</b><br>把邀請連結傳給朋友，對方點開就會自動加入；也可以請對方在「加入房間」輸入房號。<div class="inv"><button class="btn sm" id="bInvite">分享邀請連結</button><button class="btn sm alt" id="bCopy">複製連結</button></div><span id="oWait">等待隊友加入…（請保持這個畫面開著）</span>`);
    $('bInvite').onclick = async () => { try { if (navigator.share) { await navigator.share({ title: '暖暖小食堂', text: `一起來顧店！房號 ${code}`, url: link }); return; } } catch (e) { /* 使用者取消 */ return; } this.copy(link); };
    $('bCopy').onclick = () => this.copy(link);
  },
  copy(text) {
    const done = () => this.toast('已複製邀請連結');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => this.toast(text));
    else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { this.toast(text); } t.remove(); }
  },
  async netJoin(preset) {
    const code = (preset || $('oCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (code.length !== 5) return this.toast('請輸入 5 碼房號');
    this.netStatus(`正在加入房間 <b class="code">${code}</b>…`);
    try { await LC.Net.open('guest', code); }
    catch (e) { return this.netStatus(this.netWhy(e)); }
    this.netStatus(`已連上房間 <b class="code">${code}</b>，等待主持人選關卡…`);
  },
  netPartner(on) {
    if (LC.Net.role === 'host') {
      if (on) { this.toast('隊友加入了！'); LC.Audio.sfx('ready'); if (!this.run) { this.mode = 'net'; this.openSelect(); } }
      else { this.toast('隊友離開了'); const w = document.getElementById('oWait'); if (w) w.textContent = '等待隊友加入…'; }
    } else if (!on && this.run) this.toast('和主持人的連線中斷了');
  },
  netState(s) {
    if (!s || typeof s !== 'object') return;
    if (s.ph === 'lobby') { if (this.run && this.run.guest) { this.run = null; this.closeModal(); this.show('online'); } this.netStatus(`已連上主持人，等待選關中…`); return; }
    if (!LC.REST[s.r] || !LC.REST[s.r].levels[s.li] || !s.k) return;
    const r = this.run;
    if (!r || !r.guest || r.rk !== s.r || r.li !== s.li || (s.ph === 'count' && r.phase === 'end')) { this.closeModal(); this.mode = 'net'; this.start(s.r, s.li, true); }
    const run = this.run;
    try { run.ks[0].apply(s.k); } catch (e) { return; }
    if (s.ph === 'count') { run.phase = 'count'; run.count = s.c || 0; }
    else if (s.ph === 'play') { if (run.phase === 'count') LC.Audio.sfx('go'); run.phase = 'play'; }
    else if (s.ph === 'end' && run.phase !== 'end') { run.ks[0].over = true; this.checkEnd(); }
  },

  /* ---------- 彈窗 ---------- */
  modal(title, html, btns) {
    this.modalOpen = true;
    $('modalBox').innerHTML = `<h2>${title}</h2>${html}<div class="mbtns">${btns.map((b, i) => `<button class="btn${i ? ' alt' : ''}" data-b="${i}">${b.t}</button>`).join('')}</div>`;
    $('modal').hidden = false;
    $('modalBox').querySelectorAll('[data-b]').forEach(el => { el.onclick = () => { LC.Audio.sfx('tap'); this.closeModal(); btns[+el.dataset.b].f(); }; });
  },
  closeModal() { this.modalOpen = false; $('modal').hidden = true; },
  toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; clearTimeout(this.tt); this.tt = setTimeout(() => { el.hidden = true; }, 2200); },
  titleArt() {
    const c = $('tArt'), x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    LC.Art.cust(x, 0, 70, 200, 0.95, 'happy', 1); LC.Art.cust(x, 3, 270, 200, 0.95, 'ok', 2);
    LC.Art.plate(x, ['bun', 'patty', 'cheese', 'lettuce'], 170, 150, 1.5, 'burger'); LC.Art.food(x, 'fries', 120, 186, 0.9); LC.Art.food(x, 'soda', 222, 182, 0.9, { fill: 1 });
  },
};
})();

</script>
<script>LC.UI.init();</script>
</body>
